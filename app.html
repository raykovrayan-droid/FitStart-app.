<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тренировка · FitStart</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #E53935; --red-dk: #B71C1C;
      --bg: #0D0D0D; --card: #1E1E1E; --card2: #252525;
      --border: #2A2A2A; --text: #FFFFFF; --muted: #9E9E9E;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Loading */
    #loadingScreen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Expired overlay */
    #expiredOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 500; padding: 24px; }
    #expiredOverlay.show { display: flex; }
    .expired-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px; text-align: center; max-width: 420px; width: 100%; }
    .expired-icon { font-size: 56px; margin-bottom: 20px; }
    .expired-card h2 { font-size: 26px; font-weight: 900; margin-bottom: 12px; }
    .expired-card p { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .btn-upgrade { display: block; width: 100%; padding: 16px; background: var(--red); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; margin-bottom: 12px; transition: background 0.2s; font-family: 'Inter', sans-serif; }
    .btn-upgrade:hover { background: var(--red-dk); }
    .btn-logout-sm { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif; text-decoration: underline; }

    /* Header */
    header { position: sticky; top: 0; z-index: 100; background: rgba(13,13,13,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header-logo { font-size: 20px; font-weight: 900; }
    .header-logo .accent { color: var(--red); }
    .header-center { display: flex; align-items: center; gap: 8px; }
    .trial-badge { background: rgba(229,57,53,0.15); color: var(--red); border: 1px solid rgba(229,57,53,0.3); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 700; }
    .trial-badge.warning { background: rgba(255,152,0,0.15); color: #ffb74d; border-color: rgba(255,152,0,0.3); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .user-name { font-size: 13px; color: var(--muted); font-weight: 600; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-logout { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    /* Day tabs */
    .day-tabs-wrap { padding: 16px 24px 0; overflow-x: auto; scrollbar-width: none; }
    .day-tabs-wrap::-webkit-scrollbar { display: none; }
    .day-tabs { display: flex; gap: 8px; min-width: max-content; }
    .day-tab { padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); transition: all 0.2s; font-family: 'Inter', sans-serif; white-space: nowrap; }
    .day-tab:hover { border-color: rgba(229,57,53,0.4); color: var(--text); }
    .day-tab.active { background: var(--red); border-color: var(--red); color: #fff; }
    .day-tab.today { border-color: rgba(229,57,53,0.5); color: var(--text); }
    .day-tab.rest-tab { opacity: 0.6; }

    /* Main content */
    main { padding: 24px; max-width: 700px; margin: 0 auto; }

    /* Day header */
    .day-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .day-info h2 { font-size: 26px; font-weight: 900; margin-bottom: 4px; }
    .day-info p { font-size: 14px; color: var(--muted); }
    .day-type-badge { padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; background: rgba(229,57,53,0.15); color: var(--red); border: 1px solid rgba(229,57,53,0.3); }
    .day-type-badge.rest { background: rgba(255,255,255,0.06); color: var(--muted); border-color: var(--border); }

    /* Progress */
    .progress-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .progress-label { font-size: 14px; font-weight: 700; }
    .progress-count { font-size: 14px; color: var(--muted); font-weight: 600; }
    .progress-bar-bg { background: var(--border); border-radius: 6px; height: 8px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--red), #ff6b6b); border-radius: 6px; transition: width 0.4s ease; }

    /* Exercise list */
    .exercise-list { display: flex; flex-direction: column; gap: 10px; }
    .exercise-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; transition: border-color 0.2s, background 0.2s; cursor: pointer; }
    .exercise-card:hover { border-color: rgba(229,57,53,0.3); }
    .exercise-card.done { background: rgba(229,57,53,0.06); border-color: rgba(229,57,53,0.25); }

    .ex-checkbox { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; background: transparent; cursor: pointer; }
    .exercise-card.done .ex-checkbox { background: var(--red); border-color: var(--red); }

    .ex-num { width: 28px; height: 28px; border-radius: 8px; background: rgba(229,57,53,0.15); color: var(--red); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .exercise-card.done .ex-num { background: rgba(229,57,53,0.25); }

    .ex-info { flex: 1; }
    .ex-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; transition: color 0.2s; }
    .exercise-card.done .ex-name { color: var(--muted); text-decoration: line-through; }
    .ex-muscle { font-size: 12px; color: var(--muted); }

    .ex-meta { text-align: right; flex-shrink: 0; }
    .ex-sets { font-size: 13px; font-weight: 800; color: var(--red); }
    .ex-reps { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Rest day */
    .rest-screen { text-align: center; padding: 60px 24px; }
    .rest-icon { font-size: 64px; margin-bottom: 20px; }
    .rest-screen h3 { font-size: 24px; font-weight: 900; margin-bottom: 10px; }
    .rest-screen p { color: var(--muted); font-size: 15px; line-height: 1.6; }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      .user-name { display: none; }
      main { padding: 16px; }
      .day-tabs-wrap { padding: 12px 16px 0; }
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loadingScreen"><div class="spinner"></div></div>

<!-- Trial expired -->
<div id="expiredOverlay">
  <div class="expired-card">
    <div class="expired-icon">⏰</div>
    <h2>Пробният период изтече</h2>
    <p>Твоят 7-дневен безплатен период приключи. Свържи се с администратора за да продължиш.</p>
    <button class="btn-logout-sm" onclick="logout()">Изход от акаунта</button>
  </div>
</div>

<!-- App -->
<div id="appWrap" class="hidden">
  <header>
    <div class="header-logo">Fit<span class="accent">Start</span></div>
    <div class="header-center">
      <div id="trialBadge" class="trial-badge"></div>
    </div>
    <div class="header-right">
      <span id="userName" class="user-name"></span>
      <button class="btn-logout" onclick="logout()">Изход</button>
    </div>
  </header>

  <div class="day-tabs-wrap">
    <div class="day-tabs" id="dayTabs"></div>
  </div>

  <main id="mainContent"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyCjWzp7bo3fH87wEBWXzH8_bK61B5wXbU4",
    authDomain: "fitstart-app-55afd.firebaseapp.com",
    projectId: "fitstart-app-55afd",
    storageBucket: "fitstart-app-55afd.firebasestorage.app",
    messagingSenderId: "203416819949",
    appId: "1:203416819949:web:04e0ae7e415243242d54e4"
  });
  const auth = firebase.auth();
  const db = firebase.firestore();

  const DAYS = ['Неделя','Понеделник','Вторник','Сряда','Четвъртък','Петък','Събота'];
  const DAYS_SHORT = ['Нед','Пон','Вт','Ср','Чет','Пет','Съб'];

  const SCHEDULE = {
    1: { type: 'Фитнес', muscles: 'Гърди, Рамене, Гърб', exercises: [
      { id: 'mon1', name: 'Лежанка с дъмбели', muscle: 'Гърди', sets: 3, reps: '10-12' },
      { id: 'mon2', name: 'Наклонена лежанка', muscle: 'Горни гърди', sets: 3, reps: '10-12' },
      { id: 'mon3', name: 'Разтваряния с дъмбели', muscle: 'Гърди', sets: 3, reps: '12-15' },
      { id: 'mon4', name: 'Горен скрипец', muscle: 'Гърб', sets: 3, reps: '10-12' },
      { id: 'mon5', name: 'Гребане с дъмбел', muscle: 'Гърб', sets: 3, reps: '10-12' },
      { id: 'mon6', name: 'Тяга на скрипец', muscle: 'Гърб', sets: 3, reps: '12-15' },
      { id: 'mon7', name: 'Латерал рейсес', muscle: 'Рамене', sets: 3, reps: '12-15' },
      { id: 'mon8', name: 'Преден рейсес', muscle: 'Рамене', sets: 3, reps: '12-15' },
      { id: 'mon9', name: 'Армейска преса', muscle: 'Рамене', sets: 3, reps: '10-12' },
      { id: 'mon10', name: 'Шрагове с дъмбели', muscle: 'Трапец', sets: 3, reps: '15-20' },
    ]},
    2: { type: 'Фитнес', muscles: 'Крака и Корем', exercises: [
      { id: 'tue1', name: 'Клек с щанга', muscle: 'Крака', sets: 4, reps: '10-12' },
      { id: 'tue2', name: 'Преса за крака', muscle: 'Квадрицепс', sets: 3, reps: '12-15' },
      { id: 'tue3', name: 'Разгъване на крака', muscle: 'Квадрицепс', sets: 3, reps: '12-15' },
      { id: 'tue4', name: 'Сгъване на крака', muscle: 'Бицепс феморис', sets: 3, reps: '12-15' },
      { id: 'tue5', name: 'Повдигане на прасци', muscle: 'Прасци', sets: 4, reps: '15-20' },
      { id: 'tue6', name: 'Планк', muscle: 'Корем', sets: 3, reps: '45 сек' },
      { id: 'tue7', name: 'Кранчета', muscle: 'Корем', sets: 3, reps: '20' },
    ]},
    3: { type: 'Домашна', muscles: 'Цяло тяло', exercises: [
      { id: 'wed1', name: 'Лицеви опори', muscle: 'Гърди', sets: 3, reps: '15-20' },
      { id: 'wed2', name: 'Набирания', muscle: 'Гърб', sets: 3, reps: '8-12' },
      { id: 'wed3', name: 'Клекания', muscle: 'Крака', sets: 3, reps: '20' },
      { id: 'wed4', name: 'Бурпита', muscle: 'Цяло тяло', sets: 3, reps: '10' },
      { id: 'wed5', name: 'Планк', muscle: 'Корем', sets: 3, reps: '60 сек' },
      { id: 'wed6', name: 'Мост за задно бедро', muscle: 'Задно бедро', sets: 3, reps: '15' },
    ]},
    4: { type: 'Фитнес', muscles: 'Гърди, Гръб, Рамене и Бицепс', exercises: [
      { id: 'thu1', name: 'Лежанка с щанга', muscle: 'Гърди', sets: 4, reps: '8-10' },
      { id: 'thu2', name: 'Наклонена преса', muscle: 'Горни гърди', sets: 3, reps: '10-12' },
      { id: 'thu3', name: 'Кейбъл кросоувър', muscle: 'Гърди', sets: 3, reps: '12-15' },
      { id: 'thu4', name: 'Мъртва тяга', muscle: 'Гърб', sets: 4, reps: '6-8' },
      { id: 'thu5', name: 'Горен скрипец широк хват', muscle: 'Гърб', sets: 3, reps: '10-12' },
      { id: 'thu6', name: 'Тяга с права щанга', muscle: 'Гърб', sets: 3, reps: '10-12' },
      { id: 'thu7', name: 'Военна преса', muscle: 'Рамене', sets: 3, reps: '10-12' },
      { id: 'thu8', name: 'Странични повдигания', muscle: 'Рамене', sets: 3, reps: '12-15' },
      { id: 'thu9', name: 'Сгъвания с дъмбели', muscle: 'Бицепс', sets: 3, reps: '12-15' },
      { id: 'thu10', name: 'Хамър кърлс', muscle: 'Бицепс', sets: 3, reps: '12-15' },
    ]},
    5: { type: 'Фитнес', muscles: 'Крака, Трапец и Корем', exercises: [
      { id: 'fri1', name: 'Фронтален клек', muscle: 'Квадрицепс', sets: 4, reps: '10-12' },
      { id: 'fri2', name: 'Румънска мъртва тяга', muscle: 'Задно бедро', sets: 3, reps: '10-12' },
      { id: 'fri3', name: 'Изпади', muscle: 'Крака', sets: 3, reps: '12 на крак' },
      { id: 'fri4', name: 'Адуктори', muscle: 'Вътрешно бедро', sets: 3, reps: '15' },
      { id: 'fri5', name: 'Абдуктори', muscle: 'Външно бедро', sets: 3, reps: '15' },
      { id: 'fri6', name: 'Повдигане на прасци седнал', muscle: 'Прасци', sets: 4, reps: '20' },
      { id: 'fri7', name: 'Шрагове с щанга', muscle: 'Трапец', sets: 4, reps: '15-20' },
      { id: 'fri8', name: 'Обратни кранчета', muscle: 'Корем', sets: 3, reps: '20' },
      { id: 'fri9', name: 'Руски туист', muscle: 'Корем', sets: 3, reps: '20' },
    ]},
    6: { type: 'Почивка', muscles: 'Кардио и разтягане', exercises: [] },
    0: { type: 'Почивка', muscles: 'Пълна почивка', exercises: [] },
  };

  let currentUser = null;
  let currentDayIdx = new Date().getDay();
  let completedExercises = new Set();

  function getToday() {
    return new Date().toISOString().split('T')[0];
  }

  function getLogKey(dayIdx) {
    const d = new Date();
    const diff = dayIdx - d.getDay();
    const target = new Date(d);
    target.setDate(d.getDate() + diff);
    return target.toISOString().split('T')[0];
  }

  function logout() {
    auth.signOut().then(() => window.location.href = 'login.html');
  }

  function buildDayTabs() {
    const todayIdx = new Date().getDay();
    const container = document.getElementById('dayTabs');
    container.innerHTML = '';
    [1,2,3,4,5,6,0].forEach(idx => {
      const btn = document.createElement('button');
      btn.className = 'day-tab' + (idx === currentDayIdx ? ' active' : '') + (idx === todayIdx ? ' today' : '') + (SCHEDULE[idx].exercises.length === 0 ? ' rest-tab' : '');
      btn.textContent = DAYS_SHORT[idx] + (idx === todayIdx ? ' ·' : '');
      btn.onclick = () => selectDay(idx);
      container.appendChild(btn);
    });
  }

  async function selectDay(dayIdx) {
    currentDayIdx = dayIdx;
    completedExercises = new Set();
    buildDayTabs();
    await loadDayLog();
    renderDay();
  }

  async function loadDayLog() {
    if (!currentUser) return;
    const dateKey = getLogKey(currentDayIdx);
    try {
      const doc = await db.collection('users').doc(currentUser.uid).collection('logs').doc(dateKey).get();
      if (doc.exists) {
        const data = doc.data();
        completedExercises = new Set(data.completed || []);
      }
    } catch (e) { console.error(e); }
  }

  async function toggleExercise(exId) {
    if (completedExercises.has(exId)) {
      completedExercises.delete(exId);
    } else {
      completedExercises.add(exId);
    }
    renderDay();
    const dateKey = getLogKey(currentDayIdx);
    try {
      await db.collection('users').doc(currentUser.uid).collection('logs').doc(dateKey).set({
        completed: Array.from(completedExercises),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await db.collection('users').doc(currentUser.uid).update({
        lastActive: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch (e) { console.error(e); }
  }

  function renderDay() {
    const day = SCHEDULE[currentDayIdx];
    const main = document.getElementById('mainContent');
    const isRest = day.exercises.length === 0;
    const total = day.exercises.length;
    const done = day.exercises.filter(ex => completedExercises.has(ex.id)).length;

    if (isRest) {
      main.innerHTML = `
        <div class="rest-screen">
          <div class="rest-icon">${currentDayIdx === 6 ? '🏃' : '😴'}</div>
          <h3>${currentDayIdx === 6 ? 'Активна почивка' : 'Пълна почивка'}</h3>
          <p>${day.muscles}</p>
        </div>`;
      return;
    }

    const exHTML = day.exercises.map((ex, i) => {
      const isDone = completedExercises.has(ex.id);
      return `
        <div class="exercise-card ${isDone ? 'done' : ''}" onclick="toggleExercise('${ex.id}')">
          <div class="ex-checkbox">
            ${isDone ? `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>` : ''}
          </div>
          <div class="ex-num">${i + 1}</div>
          <div class="ex-info">
            <div class="ex-name">${ex.name}</div>
            <div class="ex-muscle">${ex.muscle}</div>
          </div>
          <div class="ex-meta">
            <div class="ex-sets">${ex.sets} сета</div>
            <div class="ex-reps">${ex.reps} повт.</div>
          </div>
        </div>`;
    }).join('');

    const pct = total > 0 ? Math.round((done / total) * 100) : 0;

    main.innerHTML = `
      <div class="day-header">
        <div class="day-info">
          <h2>${DAYS[currentDayIdx]}</h2>
          <p>${day.muscles}</p>
        </div>
        <div class="day-type-badge ${day.type === 'Почивка' ? 'rest' : ''}">${day.type}</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-header">
          <span class="progress-label">${done === total && total > 0 ? '🎉 Тренировката е завършена!' : 'Прогрес'}</span>
          <span class="progress-count">${done} / ${total} упражнения</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width: ${pct}%"></div>
        </div>
      </div>
      <div class="exercise-list">${exHTML}</div>`;
  }

  function updateTrialBadge(trialDaysLeft, isPaid) {
    const badge = document.getElementById('trialBadge');
    if (isPaid) {
      badge.textContent = '✓ Платен';
      badge.style.display = 'none';
    } else if (trialDaysLeft <= 2) {
      badge.textContent = `⚠ ${trialDaysLeft} ${trialDaysLeft === 1 ? 'ден' : 'дни'} остават`;
      badge.className = 'trial-badge warning';
    } else {
      badge.textContent = `${trialDaysLeft} дни trial`;
      badge.className = 'trial-badge';
    }
  }

  auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = 'login.html'; return; }
    currentUser = user;

    try {
      const userDoc = await db.collection('users').doc(user.uid).get();
      if (!userDoc.exists) { window.location.href = 'login.html'; return; }

      const data = userDoc.data();
      const trialStart = data.trialStartDate ? data.trialStartDate.toDate() : new Date();
      const daysPassed = Math.floor((Date.now() - trialStart.getTime()) / 86400000);
      const trialDaysLeft = Math.max(0, 7 - daysPassed);
      const trialExpired = trialDaysLeft === 0 && !data.isPaid;

      document.getElementById('userName').textContent = data.name || user.email;
      updateTrialBadge(trialDaysLeft, data.isPaid);

      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('appWrap').classList.remove('hidden');

      if (trialExpired) {
        document.getElementById('expiredOverlay').classList.add('show');
        return;
      }

      buildDayTabs();
      await loadDayLog();
      renderDay();

    } catch (e) {
      console.error(e);
      document.getElementById('loadingScreen').style.display = 'none';
      window.location.href = 'login.html';
    }
  });
</script>
</body>
</html>
